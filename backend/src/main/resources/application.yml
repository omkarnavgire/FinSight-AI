spring:
  application:
    name: finsight-ai

  datasource:
    # Base URL has no TLS flags. Non-local profiles must add verified TLS (see application-prod.yml);
    # ProductionSecurityValidator refuses to start otherwise. The dev profile overrides this URL.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finsight}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  # Never trust X-Forwarded-* by default (also prevents automatic trust on detected cloud platforms).
  # application-prod.yml switches to "native" with an explicit TRUSTED_PROXY_REGEX.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

finsight:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
      refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    cookie:
      secure: ${COOKIE_SECURE:true}
    # HTTPS is enforced on every profile except the local ones (dev; test in tests only).
    # Fail closed: true unless a local profile turns it off.
    require-https: true
    # Public host (host or host:port) used as the HTTPS redirect target. Never taken from the
    # request's Host header (M-1). Required outside dev.
    public-host: ${PUBLIC_HOST:}
    hsts:
      max-age-seconds: 31536000
      include-subdomains: true
    # Number of trusted reverse-proxy hops in front of this app.
    # 0 (default) = trust remoteAddr only; never read X-Forwarded-For.
    # 1 = behind one trusted load-balancer that sets X-Forwarded-For.
    # See AuthController.extractClientIp() for the algorithm.
    # Must be 0 when HTTPS is enforced: Tomcat's RemoteIpValve resolves the client IP instead.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
  cors:
    # Exact origins only, comma-separated. No default: local profiles set their own.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.finsight: DEBUG
