spring:
  application:
    name: finsight-ai

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finsight_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

finsight:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
      refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
    cookie:
      secure: ${COOKIE_SECURE:true}
    # Number of trusted reverse-proxy hops in front of this app.
    # 0 (default) = trust remoteAddr only; never read X-Forwarded-For.
    # 1 = behind one trusted load-balancer that sets X-Forwarded-For.
    # See AuthController.extractClientIp() for the algorithm.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.finsight: DEBUG
